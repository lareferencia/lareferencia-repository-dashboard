# Test front only: API requests go to the existing Compose dashboard gateway.
server {
    listen 8080;
    root /usr/share/nginx/html;
    location /api/v5/ {
        proxy_set_header Host dashboard.localhost;
        proxy_pass http://web-gateway-dev:8080;
    }
    location ~ ^/dashboard/(es|en|pt)/assets/ { try_files $uri =404; }
    location /dashboard/assets/ { try_files $uri =404; }
    location ~ ^/dashboard/(es|en|pt)(/|$) { try_files $uri /dashboard/$1/index.html; }
}
