name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check inherited npm version
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as E
          ns = '{http://maven.apache.org/POM/4.0.0}'
          version = E.parse('pom.xml').getroot().findtext(ns + 'parent/' + ns + 'version')
          package = json.load(open('web/package.json'))
          lock = json.load(open('web/package-lock.json'))
          assert package['version'] == lock['version'] == lock['packages']['']['version'] == version
          PY
      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
