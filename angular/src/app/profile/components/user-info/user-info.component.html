<section class="profile-section" *ngIf="authenticationService.currentUser as user">
  <div class="form-section">
    <h2 i18n>Account</h2>
    <dl>
      <dt i18n>Username</dt><dd>{{ user.username }}</dd>
      <dt i18n>Role</dt><dd>{{ user.roles.join(', ') }}</dd>
      <dt i18n>Readable repository IDs</dt><dd>{{ user.readableNetworkIds.join(', ') || 'All repositories' }}</dd>
    </dl>
    <p i18n>Contact an administrator to change your account or repository permissions.</p>
  </div>
</section>
